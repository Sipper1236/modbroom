name: Windows build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: pytest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests -q

  windows-build:
    name: Build Windows exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --clean modbroom.spec
      - name: Import every UI module (headless)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -c "import modbroom.ui.app, modbroom.ui.pages.dashboard, modbroom.ui.pages.library, modbroom.ui.pages.diagnostics, modbroom.ui.pages.fifty, modbroom.ui.pages.tools, modbroom.ui.pages.settings, modbroom.ui.pages.companion, modbroom.ui.bisect_bridge; print('all UI modules import cleanly')"
      - name: Verify the exe exists and is non-trivial
        shell: pwsh
        run: |
          $f = Get-Item dist\ModBroom.exe
          if ($f.Length -lt 20MB) { throw "exe suspiciously small: $($f.Length)" }
          Write-Host "Built $($f.FullName) ($($f.Length) bytes)"
      - name: Smoke test --cli-scan
        shell: pwsh
        run: |
          $demo = "$env:RUNNER_TEMP\demo_mods"
          New-Item -ItemType Directory -Force "$demo" | Out-Null
          python -m modbroom.demo "$demo"
          $out = & dist\ModBroom.exe --cli-scan "$demo" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Scanned') { throw 'exe did not produce scan output' }
          if ($out -notmatch 'conflicts=') { throw 'exe output missing conflict report' }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModBroom-windows
          path: dist/ModBroom.exe
          retention-days: 14
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ModBroom.exe
